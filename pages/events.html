<div id="notification" class="notification">
    <span>Welcome to StudentHub!</span>
    <button id="closeNotification">X</button>
</div>


<header>

<div class="logo">StudentHub</div>

<nav>

<section class="hero">
    <h1>Campus Events</h1>
    <p>Discover exciting opportunities happening around campus. Loaded dynamically via Fetch API from external JSON.</p>
    
    <div class="directory-controls">
        <input type="text" id="eventSearchInput" placeholder="🔍 Search event or venue...">
        <select id="eventFilterCategory">
            <option value="">All Categories</option>
            <option value="Competition">Competition</option>
            <option value="Cultural">Cultural</option>
            <option value="Workshop">Workshop</option>
            <option value="Seminar">Seminar</option>
        </select>
        <button id="eventSortBtn" class="btn">Sort: A to Z ↕</button>
    </div>
</section>

<section class="features" id="eventsContainer">
    <!-- Events dynamically rendered by script.js using Fetch API -->
</section>
